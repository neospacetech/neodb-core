[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neodb-core"
version = "0.1.0.dev0"
description = "Embeddable, schema-aware database engine for NeoQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NeoSpace Tech" }]
keywords = ["database", "query-language", "graph", "embedded"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "coverage[toml]>=7.10",
    "mypy>=1.17",
    "ruff>=0.12",
]

[project.scripts]
neodb = "cli.__main__:main"

[project.urls]
Homepage = "https://github.com/neospacetech/neodb-core"
Issues = "https://github.com/neospacetech/neodb-core/issues"
Roadmap = "https://github.com/orgs/neospacetech/projects/3"

[tool.setuptools]
py-modules = ["engine"]

[tool.setuptools.packages.find]
include = ["cli*", "datasets*", "neoql*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["cli", "datasets", "engine", "neoql"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 70
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
